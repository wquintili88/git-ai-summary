[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-ai-summary"
version = "0.1.0"
description = "CLI tool to generate README, CHANGELOG, and PR descriptions using Groq AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["git", "ai", "groq", "llama", "readme", "changelog", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12.0",
    "groq>=0.9.0",
    "gitpython>=3.1.40",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
git-ai = "git_ai_summary.cli:app"

[project.urls]
Homepage = "https://github.com/wquintili88/git-ai-summary"
Repository = "https://github.com/wquintili88/git-ai-summary"
Issues = "https://github.com/wquintili88/git-ai-summary/issues"

[tool.hatch.build.targets.wheel]
packages = ["git_ai_summary"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"

[tool.ruff]
line-length = 100
target-version = "py39"
